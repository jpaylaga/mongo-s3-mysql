name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: no em or en dashes
        # Fails closed: exit 1 from grep means no match, anything else (a match, or grep itself failing) fails the step.
        run: rc=0; LC_ALL=C.UTF-8 grep -rnP '[\x{2013}\x{2014}]' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git . || rc=$?; test "$rc" -eq 1
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --help > /dev/null

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
